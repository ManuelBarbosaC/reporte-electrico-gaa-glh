<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard Eléctrico</title>

<style>
body{margin:0;font-family:system-ui;background:#0f1720;color:white}
.card{background:#111e2b;margin:10px;padding:12px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.k{background:#0b141f;padding:10px;border-radius:8px;text-align:center}
.ok{color:#00c853}
.bad{color:#ff1744}
.warn{color:#ffd600}
canvas{width:100%;height:320px;background:#0a0f1a}
small{opacity:0.7}
</style>

</head>

<body>

<h2 style="padding:10px">⚡ Dashboard Eléctrico GAA / GLH</h2>

<div class="card">
<input type="date" id="inputFecha">
<div id="fechaActual"></div>
</div>

<div class="card">
<div id="kpis" class="grid"></div>
</div>

<div class="card"><h3>Generación por unidad</h3>
<div id="gen"></div></div>

<div class="card"><h3>Comparativo unidades</h3>
<div id="gen_comp" class="grid"></div></div>

<div class="card"><h3>Comparativo transformadores</h3>
<div id="trs_comp" class="grid"></div></div>

<div class="card"><h3>Comparativo líneas</h3>
<div id="lin_comp" class="grid"></div></div>

<div class="card"><h3>Histórico</h3>
<canvas id="chart"></canvas></div>

<script>

// ===== UTIL =====
const n = v => Number(v)||0

function trend(h,a){
 let d=h-a
 let pct=a?d/a*100:0
 let icon="●",c=""
 if(d>0){icon="▲";c="ok"}
 if(d<0){icon="▼";c="bad"}
 return `${icon} ${pct.toFixed(1)}%`
}

// ===== ADAPTAR =====
function adapt(d){

 let gen=0

 Object.values(d.kpis_generacion||{}).forEach(v=>{
   gen+=n(v.potencia_MW)
 })

 d.kpis.gen=gen
 d.kpis.dem=n(d.kpis.demanda_total_MW)
 d.kpis.stn=n(d.kpis.STN)

 return d
}

// ===== KPIS =====
function renderKpis(d){

 document.getElementById("kpis").innerHTML=`
 <div class="k">Demanda<br>${d.kpis.dem}</div>
 <div class="k">STN<br>${d.kpis.stn}</div>
 <div class="k">Gen<br>${d.kpis.gen}</div>`
}

// ===== GENERACION =====
function renderGen(d){

 let g=d.kpis_generacion||{}

 document.getElementById("gen").innerHTML=
 Object.entries(g).map(([k,v])=>{
   return `<div class="k">${k}<br>${n(v.potencia_MW)}</div>`
 }).join("")
}

// ===== COMPARATIVO GENERACION =====
function cmpGen(h,a){

 let out=document.getElementById("gen_comp")

 let keys=new Set([...Object.keys(h.kpis_generacion||{}),
                   ...Object.keys(a.kpis_generacion||{})])

 out.innerHTML=[...keys].map(k=>{
   let hv=n(h.kpis_generacion[k]?.potencia_MW)
   let av=n(a.kpis_generacion[k]?.potencia_MW)

   return `<div class="k">
   ${k}<br>${hv}
   <br><small>${trend(hv,av)}</small>
   </div>`
 }).join("")
}

// ===== COMPARATIVO RED =====
function mapList(l){
 let o={}
 l.forEach(x=>o[x.nombre]=n(x.MW))
 return o
}

function cmpList(h,a,id){

 let box=document.getElementById(id)

 let H=mapList(h)
 let A=mapList(a)

 let keys=new Set([...Object.keys(H),...Object.keys(A)])

 box.innerHTML=[...keys].map(k=>{
   let hv=n(H[k])
   let av=n(A[k])

   return `<div class="k">
   ${k}<br>${hv}
   <br><small>${trend(hv,av)}</small>
   </div>`
 }).join("")
}

// ===== GRAFICO =====
function plot(hist){

 let c=document.getElementById("chart")
 let ctx=c.getContext("2d")

 c.width=c.offsetWidth
 c.height=320

 let dem=hist.map(x=>x.kpis.dem)
 let gen=hist.map(x=>x.kpis.gen)

 let max=Math.max(...dem,...gen)
 let min=Math.min(...dem,...gen)
 let r=max-min||1

 let m={l:50,b:30}

 let x=i=>m.l+i/(hist.length-1)*(c.width-m.l-10)
 let y=v=>c.height-m.b-(v-min)/r*(c.height-m.b)

 ctx.clearRect(0,0,c.width,c.height)

 // eje Y
 for(let i=0;i<5;i++){
   let val=min+r/4*i
   let yy=y(val)
   ctx.fillText(val.toFixed(0),5,yy)
 }

 // eje X
 hist.forEach((d,i)=>{
   ctx.fillText(d.fecha.slice(5),x(i)-15,c.height)
 })

 // lineas
 function draw(arr,col){
   ctx.beginPath()
   ctx.strokeStyle=col
   arr.forEach((v,i)=>{
     i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v))
   })
   ctx.stroke()
 }

 draw(dem,"#FFD100")
 draw(gen,"#00c853")

 // deficit
 for(let i=0;i<dem.length;i++){
   if(dem[i]>gen[i]){
     ctx.fillStyle="rgba(255,0,0,0.3)"
     ctx.fillRect(x(i)-4,y(dem[i]),8,y(gen[i])-y(dem[i]))
   }
 }
}

// ===== MAIN =====
async function run(){

 let m=await fetch("manifest.json").then(r=>r.json())
 let f=m.fechas.sort((a,b)=>new Date(a)-new Date(b))

 document.getElementById("inputFecha").value=f.at(-1)

 document.getElementById("inputFecha").onchange=e=>{
   load(e.target.value,f)
 }

 load(f.at(-1),f)
}

async function load(fecha,f){

 let d=adapt(await fetch("data/"+fecha+".json").then(r=>r.json()))

 let i=f.indexOf(fecha)
 let a=i>0?adapt(await fetch("data/"+f[i-1]+".json").then(r=>r.json())):null

 let hist=await Promise.all(
   f.slice(Math.max(0,i-6),i+1)
    .map(x=>fetch("data/"+x+".json")
    .then(r=>r.json()).then(adapt))
 )

 document.getElementById("fechaActual").innerText=fecha

 renderKpis(d)
 renderGen(d)
 if(a){
   cmpGen(d,a)

   cmpList(d.sistema_electrico.transformadores,
           a.sistema_electrico.transformadores,
           "trs_comp")

   cmpList(d.sistema_electrico.lineas,
           a.sistema_electrico.lineas,
           "lin_comp")
 }

 plot(hist)
}

run()

</script>

</body>
</html>
