<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard Eléctrico – GAA/GLH</title>

<style>
body{margin:0;font-family:system-ui;background:#0f1720;color:white}
.card{background:#111e2b;margin:10px;padding:12px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.k{background:#0b141f;padding:10px;border-radius:8px;text-align:center}
.ok{color:#00c853} .warn{color:#ffd600} .bad{color:#ff1744}
canvas{width:100%;height:300px;background:#0a0f1a;border-radius:10px}
h3{margin-top:0}
</style>
</head>

<body>

<h2 style="padding:10px">⚡ Dashboard Eléctrico GAA / GLH</h2>

<!-- KPIs -->
<div class="card">
<h3>📊 KPIs</h3>
<div id="kpis" class="grid"></div>
</div>

<!-- GENERACIÓN -->
<div class="card">
<h3>⚡ Generación por Unidad</h3>
<div id="gen_unidades" class="grid"></div>
</div>

<!-- COMPARATIVO -->
<div class="card">
<h3>📊 HOY vs AYER</h3>
<div id="comparativo" class="grid"></div>
</div>

<!-- HISTORICO -->
<div class="card">
<h3>📈 Histórico (Demanda vs Generación)</h3>
<canvas id="grafico"></canvas>
</div>

<!-- SCADA -->
<div class="card">
<h3>🖥️ SCADA</h3>
<canvas id="scada"></canvas>
</div>

<!-- ALERTAS -->
<div class="card">
<h3>🚨 Alertas</h3>
<ul id="alertas"></ul>
</div>

<div class="card">
<h3>Estado Sistema</h3>
<div id="estadoSistema"></div>
</div>

<script>

// ===== KPIs =====
function renderKpis(data){

  const d=data.kpis;

  document.getElementById("kpis").innerHTML=`
    <div class="k">Demanda<br>${d.demanda_total_MW.toFixed(1)} MW</div>
    <div class="k">STN<br>${d.STN.toFixed(1)} MW</div>
    <div class="k">Generación<br>${d.generacion_total_MW.toFixed(1)} MW</div>
  `;
}

// ===== GENERACION =====
function renderGeneracion(data){

  const gen=data.kpis_generacion;

  const html=Object.entries(gen).map(([k,v])=>{

    let mw=Number(v.potencia_MW||0);

    let c="ok";
    if(mw===0) c="bad";
    if(mw>50) c="warn";

    return `
      <div class="k ${c}">
        ${k}<br>
        ${mw.toFixed(1)} MW
      </div>
    `;
  }).join("");

  document.getElementById("gen_unidades").innerHTML=html;
}

// ===== COMPARATIVO =====
function renderComparativo(hoy,ayer){

  if(!ayer){
    document.getElementById("comparativo").innerHTML="<div class='k'>Sin histórico suficiente</div>";
    return;
  }

  function fila(n,h,a){
    if(!a) return `<div class="k">${n}<br>—</div>`;
    let diff=h-a;
    let pct=(diff/a)*100;
    let col=diff>0?"ok":"bad";
    let icon=diff>0?"▲":"▼";

    return `<div class="k ${col}">
      ${n}<br>${h}<br><small>${icon} ${pct.toFixed(1)}%</small>
    </div>`;
  }

  document.getElementById("comparativo").innerHTML=`
    ${fila("Demanda",hoy.kpis.demanda_total_MW,ayer.kpis.demanda_total_MW)}
    ${fila("STN",hoy.kpis.STN,ayer.kpis.STN)}
    ${fila("Gen",hoy.kpis.generacion_total_MW,ayer.kpis.generacion_total_MW)}
  `;
}

// ===== GRAFICO =====
function renderGrafico(hist){

  if(!hist||hist.length<2) return;

  const c=document.getElementById("grafico");
  const ctx=c.getContext("2d");

  c.width=c.offsetWidth;
  c.height=300;

  ctx.clearRect(0,0,c.width,c.height);

  const demanda=hist.map(d=>d.kpis.demanda_total_MW);
  const gen=hist.map(d=>d.kpis.generacion_total_MW);

  const max=Math.max(...demanda,...gen);
  const min=Math.min(...demanda,...gen);
  const rango=max-min||1;

  function drawLine(data,color){
    ctx.beginPath();
    ctx.strokeStyle=color;

    data.forEach((v,i)=>{
      let x=i/(data.length-1)*c.width;
      let y=c.height-((v-min)/rango)*c.height;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });

    ctx.stroke();
  }

  drawLine(demanda,"#FFD100"); // demanda
  drawLine(gen,"#00c853"); // generación
}

// ===== SCADA =====
function renderSCADA(data){

  const c=document.getElementById("scada");
  const ctx=c.getContext("2d");

  c.width=c.offsetWidth;
  c.height=300;

  const trs=data.sistema_electrico.transformadores.slice(0,6);
  const lns=data.sistema_electrico.lineas.slice(0,6);

  let offset=0;

  function draw(){

    ctx.clearRect(0,0,c.width,c.height);

    let cx=c.width/2,cy=c.height/2;

    ctx.fillStyle="#00c853";
    ctx.beginPath();
    ctx.arc(cx,cy,10,0,6.28);
    ctx.fill();

    function flow(x1,y1,x2,y2,color){
      for(let i=0;i<4;i++){
        let t=(i+offset)%4/4;
        ctx.fillStyle=color;
        ctx.beginPath();
        ctx.arc(x1+(x2-x1)*t,y1+(y2-y1)*t,3,0,6.28);
        ctx.fill();
      }
    }

    trs.forEach((t,i)=>{
      let a=i/trs.length*Math.PI;
      let x=cx+Math.cos(a)*120;
      let y=cy-Math.sin(a)*90;

      let color="lime";
      if(t.MW>40) color="yellow";
      if(t.MW>70) color="red";

      ctx.strokeStyle=color;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.stroke();

      flow(cx,cy,x,y,color);
    });

    lns.forEach((l,i)=>{
      let a=i/lns.length*Math.PI+Math.PI;
      let x=cx+Math.cos(a)*150;
      let y=cy-Math.sin(a)*110;

      ctx.strokeStyle="#4aa3ff";
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.stroke();

      flow(cx,cy,x,y,"#4aa3ff");
    });

    offset+=0.05;
    requestAnimationFrame(draw);
  }

  draw();
}

// ===== ALERTAS =====
function renderAlertas(data){
  let ul=document.getElementById("alertas");
  ul.innerHTML="";

  let k=data.kpis;

  if((k.STN||0)/(k.demanda_total_MW||1)>0.7)
    ul.innerHTML+="<li>🔴 Alta dependencia STN</li>";

  if(k.generacion_total_MW < k.demanda_total_MW*0.5)
    ul.innerHTML+="<li>🔴 Baja generación</li>";

  if(ul.innerHTML==="")
    ul.innerHTML="<li>🟢 Sistema estable</li>";
}

// ===== ESTADO =====
function renderEstado(){
  document.getElementById("estadoSistema").innerText="🟢 OPERACIÓN NORMAL";
}

// ===== CARGA =====
async function cargarDatos(){

  const manifest=await fetch("manifest.json").then(r=>r.json());

  const fechas=manifest.fechas.sort();

  const hoy_fecha=fechas.at(-1);

  const hoy=await fetch("data/"+hoy_fecha+".json").then(r=>r.json());

  const hist_raw=await Promise.all(
    fechas.slice(-7).map(async f=>{
      try{
        let r=await fetch("data/"+f+".json");
        if(!r.ok) return null;
        return await r.json();
      }catch{return null;}
    })
  );

  const hist=hist_raw.filter(x=>x&&x.kpis);

  const ayer=hist.length>1?hist.at(-2):null;

  renderKpis(hoy);
  renderGeneracion(hoy);
  renderComparativo(hoy,ayer);
  renderGrafico(hist);
  renderSCADA(hoy);
  renderAlertas(hoy);
  renderEstado();
}

cargarDatos();

</script>

</body>
</html>
