
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard Reporte Eléctrico – GAA / GLH</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:system-ui;background:#0f1720;color:#e8eefc}
header{padding:16px;background:#111e2b;border-bottom:1px solid rgba(255,255,255,.1)}
main{padding:16px;max-width:1300px;margin:auto}
.card{background:#111e2b;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.k{border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px}
.ok{color:#2ecc71}.warn{color:#f1c40f}.bad{color:#e74c3c}
.small{font-size:12px;color:#b9c3de}
</style>
</head>

<body>
<header>
  <h2>Dashboard Reporte Eléctrico – GAA / GLH</h2>
  <div id="fecha" class="small"></div>
</header>

<main>

<div class="card">
  <label class="small">📅 Fecha</label>
  <select id="fechaSelect"></select>
</div>

<div class="card">
  <h3>🔥 Gas</h3>
  <div id="gas" class="grid"></div>
</div>

<div class="card">
  <h3>⚡ Generación</h3>
  <div id="gen" class="grid"></div>
</div>

<div class="card">
  <h3>🚨 Alertas</h3>
  <ul id="alertas"></ul>
</div>

</main>

<script>
let HIST = {};

function calcGenTotal(rep){
  return Object.values(rep.kpis_generacion||{})
    .reduce((a,u)=>a+(u.potencia_MW||0),0);
}

function cargar(){
  fetch('manifest.json')
    .then(r=>r.json())
    .then(m=>{
      let chain=Promise.resolve();
      m.fechas.forEach(f=>{
        chain=chain.then(()=>fetch('data/'+f+'.json')
          .then(r=>r.json())
          .then(j=>HIST[f]=j));
      });
      return chain.then(()=>m.fechas);
    })
    .then(fechas=>{
      const sel=document.getElementById('fechaSelect');
      sel.innerHTML='';
      fechas.forEach(f=>{
        const o=document.createElement('option');
        o.value=f; o.textContent=f; sel.appendChild(o);
      });
      sel.value=fechas[fechas.length-1];
      sel.onchange=()=>render(sel.value);
      render(sel.value);
    });
}

function render(f){
  const fechas=Object.keys(HIST).sort();
  const i=fechas.indexOf(f);
  const hoy=HIST[f];
  const ayer=HIST[fechas[Math.max(0,i-1)]];

  document.getElementById('fecha').innerText =
    `HOY: ${hoy.fecha} | AYER: ${ayer.fecha}`;

  // GAS
  const g=document.getElementById('gas');
  g.innerHTML='';
  g.innerHTML+=`
    <div class="k">
      <div class="small">Gas total</div>
      <b>${hoy.kpis.gas_total_KPC.toLocaleString()} KPC</b><br>
      Intensidad: ${hoy.kpis.intensidad_gas_KPC_por_MWh_neta.toFixed(2)}
    </div>`;
  Object.entries(hoy.consumo_gas_unidades||{}).forEach(([u,d])=>{
    const i=d.KPC/d.MWh_neta;
    let c='ok'; if(i>=10)c='bad'; else if(i>=9)c='warn';
    g.innerHTML+=`
      <div class="k ${c}">
        <div class="small">${u}</div>
        ${d.KPC.toLocaleString()} KPC<br>
        ${d.MWh_neta.toLocaleString()} MWh<br>
        ${i.toFixed(2)} KPC/MWh
      </div>`;
  });

  // GENERACIÓN
  const genH=calcGenTotal(hoy);
  const genA=calcGenTotal(ayer);
  document.getElementById('gen').innerHTML=`
    <div class="k">
      HOY: ${genH.toFixed(1)} MW<br>
      AYER: ${genA.toFixed(1)} MW<br>
      Δ ${(genH-genA).toFixed(1)} MW
    </div>`;

  // ALERTAS
  const ul=document.getElementById('alertas');
  ul.innerHTML='';
  if(hoy.kpis.intensidad_gas_KPC_por_MWh_neta>=9)
    ul.innerHTML+='<li class="warn">Intensidad de gas elevada</li>';
  if(hoy.kpis.dependencia_STN_pct>=55)
    ul.innerHTML+='<li class="bad">Alta dependencia STN</li>';
  if(!ul.innerHTML) ul.innerHTML='<li class="ok">Sin alertas críticas</li>';
}

window.onload=cargar;
</script>
</body>
</html>
