<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard Eléctrico GAA / GLH</title>

<style>
body{margin:0;font-family:system-ui;background:#0f1720;color:white}
.card{background:#111e2b;margin:10px;padding:12px;border-radius:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.k{background:#0b141f;padding:10px;border-radius:8px;text-align:center}
canvas{width:100%;height:320px;background:#0a0f1a;border-radius:12px}
select{background:#0b141f;color:white;padding:8px;border-radius:8px;border:none}
.ok{color:#00c853}.bad{color:#ff1744}
</style>
</head>

<body>

<h2 style="padding:10px">⚡ Dashboard Eléctrico</h2>

<div class="card">
<select id="fechaSelect"></select>
</div>

<div class="card">
<div id="kpis" class="grid"></div>
</div>

<div class="card">
<h3>📈 Demanda vs Generación</h3>
<canvas id="chart"></canvas>
</div>

<div class="card">
<h3>⚡ Cargas</h3>
<select id="selGer">
<option value="GDT">GDT</option>
<option value="GCH">GCH</option>
<option value="GDA">GDA</option>
<option value="GLC">GLC</option>
</select>
<div id="cargas" class="grid"></div>
</div>

<script>

let HIST = {};

// ===== ADAPTADOR NUEVO JSON =====
function adaptar(rep){

  // demanda
  const dem = Number(rep.kpis?.demanda_total_MW || 0);

  // generación
  let gen = 0;
  if(rep.generacion){
    Object.values(rep.generacion).forEach(grupo=>{
      gen += Object.values(grupo).reduce((a,v)=>a+Number(v||0),0);
    });
  }

  return {
    fecha: rep.fecha,
    demanda: dem,
    generacion: gen,
    cargas: rep.cargas || {}
  };
}

// ===== KPIs =====
function renderKpis(d){
  document.getElementById('kpis').innerHTML=`
    <div class="k">Demanda<br>${d.demanda.toFixed(1)}</div>
    <div class="k">Generación<br>${d.generacion.toFixed(1)}</div>
    <div class="k ${d.demanda>d.generacion?'bad':'ok'}">
      Balance<br>${(d.generacion-d.demanda).toFixed(1)}
    </div>
  `;
}

// ===== CARGAS =====
function renderCargas(d, g){

  let det={};

  if(g==="GDT") det=d.cargas.GDT_detalle||{};
  else if(g==="GCH") det=d.cargas.GCH_detalle||{};
  else det=d.cargas.Orinoquia||{};

  let max=Math.max(...Object.values(det).map(x=>x||0));

  document.getElementById('cargas').innerHTML =
    Object.entries(det).map(([k,v])=>{
      let pct=max?(v/max)*100:0;

      return `
      <div class="k">
        ${k}<br>${v.toFixed(1)}
        <div style="background:#222;height:6px">
          <div style="width:${pct}%;height:100%;background:#00c853"></div>
        </div>
      </div>`;
    }).join('');
}

// ===== GRÁFICO =====
function renderGrafico(){

  const canvas=document.getElementById('chart');
  const ctx=canvas.getContext('2d');

  const data=Object.values(HIST);

  if(data.length<2) return;

  canvas.width=canvas.offsetWidth;
  canvas.height=320;

  const dem=data.map(x=>x.demanda);
  const gen=data.map(x=>x.generacion);

  const max=Math.max(...dem,...gen);
  const min=Math.min(...dem,...gen);
  const r=max-min||1;

  const x = i => i/(data.length-1)*canvas.width;
  const y = v => canvas.height-((v-min)/r)*canvas.height;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // líneas
  function draw(arr,color){
    ctx.beginPath();
    ctx.strokeStyle=color;

    arr.forEach((v,i)=>{
      let px=x(i), py=y(v);
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    });

    ctx.stroke();
  }

  draw(dem,"#FFD100");     // demanda
  draw(gen,"#00c853");     // generación

  // DÉFICIT
  for(let i=0;i<dem.length;i++){

    if(dem[i]>gen[i]){

      ctx.fillStyle="rgba(255,0,0,0.25)";

      ctx.fillRect(
        x(i)-6,
        y(dem[i]),
        12,
        y(gen[i]) - y(dem[i])
      );
    }
  }
}

// ===== FLUJO =====
async function cargar(){

  const m = await fetch("manifest.json").then(r=>r.json());
  const fechas = m.fechas.sort();

  const sel=document.getElementById("fechaSelect");

  // cargar histórico
  for(let f of fechas){
    let raw = await fetch("data/"+f+".json").then(r=>r.json());
    HIST[f] = adaptar(raw);

    let opt=document.createElement("option");
    opt.value=f;
    opt.textContent=f;
    sel.appendChild(opt);
  }

  sel.value = fechas.at(-1);

  function render(){

    const h = HIST[sel.value];

    renderKpis(h);
    renderGrafico();

    renderCargas(h, document.getElementById("selGer").value);
  }

  sel.onchange=render;

  document.getElementById("selGer").onchange=render;

  render();
}

cargar();

</script>

</body>
</html>
