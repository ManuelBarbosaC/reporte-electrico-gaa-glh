<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard Eléctrico – GAA/GLH</title>

<style>
body{margin:0;font-family:system-ui;background:#0f1720;color:white}
.card{background:#111e2b;margin:10px;padding:10px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{background:#0b141f;padding:8px;border-radius:8px;text-align:center}
.ok{color:#00c853} .warn{color:#ffd600} .bad{color:#ff1744}
canvas{width:100%;height:300px;background:#0a0f1a;border-radius:10px}
</style>
</head>

<body>

<h2 style="padding:10px">⚡ Dashboard Eléctrico GAA / GLH</h2>

<div class="card">
<h3>📊 KPIs</h3>
<div id="kpis" class="grid"></div>
</div>

<div class="card">
<h3>📊 HOY vs AYER</h3>
<div id="comparativo" class="grid"></div>
</div>

<div class="card">
<h3>📈 Historial Demanda</h3>
<canvas id="grafico"></canvas>
</div>

<div class="card">
<h3>🖥️ SCADA</h3>
<canvas id="scada"></canvas>
</div>

<div class="card">
<h3>🚨 Alertas</h3>
<ul id="alertas"></ul>
</div>

<div class="card">
<h3>Estado Sistema</h3>
<div id="estadoSistema"></div>
</div>

<script>

// ================= KPIs =================
function renderKpis(data){

  const d = data.kpis || {};

  const demanda = d.demanda_promedio_MW ?? d.demanda_total_MW ?? 0;
  const stn = d.importacion_GEB_230kV_MW ?? d.STN ?? 0;
  const gen = d.generacion_total_MW ?? d.Generacion_Total ?? 0;

  document.getElementById("kpis").innerHTML = `
  <div class="k">Demanda<br>${demanda}</div>
  <div class="k">STN<br>${stn}</div>
  <div class="k">Generación<br>${gen}</div>`;
}

// ================= COMPARATIVO =================
function renderComparativo(hoy,ayer){

  if(!ayer){
    document.getElementById("comparativo").innerHTML =
      "<div class='k'>Sin histórico suficiente</div>";
    return;
  }

  function get(d,k1,k2){
    return d.kpis[k1] ?? d.kpis[k2] ?? 0;
  }

  function fila(n,h,a){
    if(!a) return `<div class="k">${n}<br>—</div>`;
    let diff=h-a;
    let pct=(diff/a)*100;
    let col=diff>0?"ok":"bad";
    let icon=diff>0?"▲":"▼";

    return `<div class="k ${col}">
    ${n}<br>${h}<br><small>${icon} ${pct.toFixed(1)}%</small>
    </div>`;
  }

  const demH = get(hoy,"demanda_promedio_MW","demanda_total_MW");
  const demA = get(ayer,"demanda_promedio_MW","demanda_total_MW");

  const stnH = get(hoy,"importacion_GEB_230kV_MW","STN");
  const stnA = get(ayer,"importacion_GEB_230kV_MW","STN");

  const genH = get(hoy,"generacion_total_MW","Generacion_Total");
  const genA = get(ayer,"generacion_total_MW","Generacion_Total");

  document.getElementById("comparativo").innerHTML = `
    ${fila("Demanda",demH,demA)}
    ${fila("STN",stnH,stnA)}
    ${fila("Gen",genH,genA)}
  `;
}

// ================= GRAFICO =================
function renderGrafico(hist){

  if(!hist || hist.length < 2){
    console.warn("Sin histórico suficiente");
    return;
  }

  const c=document.getElementById("grafico");
  const ctx=c.getContext("2d");

  c.width=c.offsetWidth;
  c.height=300;

  ctx.clearRect(0,0,c.width,c.height);

  const datos = hist.map(d=>d?.kpis?.demanda_promedio_MW || 0);

  const max=Math.max(...datos);
  const min=Math.min(...datos);
  const rango=max-min || 1;

  ctx.beginPath();
  ctx.strokeStyle="#FFD100";

  datos.forEach((v,i)=>{
    const x=i/(datos.length-1)*c.width;
    const y=c.height-((v-min)/rango)*c.height;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });

  ctx.stroke();
}

// ================= SCADA =================
let iniciado=false;
function renderSCADA(data){

  if(iniciado) return;
  iniciado=true;

  const c=document.getElementById("scada");
  const ctx=c.getContext("2d");

  c.width=c.offsetWidth;
  c.height=300;

  let offset=0;

  function draw(){

    ctx.clearRect(0,0,c.width,c.height);

    let cx=c.width/2;
    let cy=c.height/2;

    ctx.fillStyle="#00c853";
    ctx.beginPath(); ctx.arc(cx,cy,15,0,6.28); ctx.fill();

    offset+=0.05;
    requestAnimationFrame(draw);
  }

  draw();
}

// ================= ALERTAS =================
function renderAlertas(data){
  let ul=document.getElementById("alertas");
  ul.innerHTML="";
  let d=data.kpis||{};
  if((d.importacion_GEB_230kV_MW||0)/(d.demanda_promedio_MW||1)>0.7)
    ul.innerHTML="<li>🔴 Alta dependencia STN</li>";
  else ul.innerHTML="<li>🟢 Sistema estable</li>";
}

// ================= ESTADO =================
function renderEstado(){
  document.getElementById("estadoSistema").innerText="🟢 NORMAL";
}

// ================= CARGA =================
function cargarDatos(){

  fetch("manifest.json")
  .then(r => r.json())
  .then(async manifest => {

    const fechas = manifest.fechas.sort();

    const hoy_fecha = fechas.at(-1);

    const hoy = await fetch("data/"+hoy_fecha+".json").then(r=>r.json());

    const hist_raw = await Promise.all(
      fechas.slice(-7).map(async f => {
        try{
          const r = await fetch("data/"+f+".json");
          if(!r.ok) return null;
          return await r.json();
        }catch{
          return null;
        }
      })
    );

    return {hoy, hist_raw};

  })
  .then(({hoy, hist_raw}) => {

    const hist = hist_raw.filter(x => x && x.kpis);

    const hoyData = hoy;
    const ayerData = hist.length > 1 ? hist.at(-2) : null;

    renderKpis(hoyData);
    renderComparativo(hoyData,ayerData);
    renderGrafico(hist);
    renderSCADA(hoyData);
    renderAlertas(hoyData);
    renderEstado();

  })
  .catch(err=>{
    console.error(err);
    alert("Error cargando datos");
  });

}

cargarDatos();

</script>

</body>
</html>
