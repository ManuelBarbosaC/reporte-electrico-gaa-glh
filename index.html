<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard Eléctrico – GAA/GLH</title>

<style>
body{margin:0;font-family:system-ui;background:#0f1720;color:white}
.card{background:#111e2b;margin:10px;padding:12px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.k{background:#0b141f;padding:10px;border-radius:8px;text-align:center}
.ok{color:#00c853}.warn{color:#ffd600}.bad{color:#ff1744}
canvas{width:100%;height:300px;background:#0a0f1a;border-radius:10px}
h3{margin-top:0}
</style>
</head>

<body>

<h2 style="padding:10px">⚡ Dashboard Eléctrico GAA / GLH</h2>

<div class="card">
<h3>📅 Fecha</h3>
<input type="date" id="inputFecha">
<div id="fechaActual"></div>
</div>

<div class="card">
<h3>📊 KPIs</h3>
<div id="kpis" class="grid"></div>
</div>

<div class="card">
<h3>⚡ Generación</h3>
<div id="gen_unidades" class="grid"></div>
</div>

<div class="card">
<h3 id="tituloComparativo">📊 Comparativo</h3>
<div id="comparativo" class="grid"></div>
</div>

<div class="card">
<h3>📈 Histórico</h3>
<canvas id="grafico"></canvas>
</div>

<div class="card">
<h3>🖥️ SCADA</h3>
<canvas id="scada"></canvas>
</div>

<div class="card">
<h3>🚨 Alertas</h3>
<ul id="alertas"></ul>
</div>

<div class="card">
<h3>Estado</h3>
<div id="estadoSistema"></div>
</div>

<script>

// ===== ADAPTADOR JSON =====
function adaptarData(data){

  // total generación
  let totalGen = 0;

  if(data.generacion){
    Object.values(data.generacion).forEach(grupo=>{
      totalGen += Object.values(grupo).reduce((a,v)=>a+Number(v||0),0);
    });
  }

  // crear formato esperado
  data.kpis.demanda_total_MW = Number(data.kpis.demanda_total_MW || 0);
  data.kpis.generacion_total_MW = totalGen;

  // generar kpis_generacion
  data.kpis_generacion = {};

  if(data.generacion?.termica){
    Object.entries(data.generacion.termica).forEach(([k,v])=>{
      data.kpis_generacion[k] = {potencia_MW:Number(v||0)};
    });
  }

  return data;
}

// ===== RENDER =====
function renderFecha(data){
  document.getElementById("fechaActual").innerText = data.fecha;
}

function renderKpis(data){
  const d=data.kpis;

  document.getElementById("kpis").innerHTML=`
    <div class="k">Demanda<br>${d.demanda_total_MW.toFixed(1)} MW</div>
    <div class="k">STN<br>${d.STN.toFixed(1)} MW</div>
    <div class="k">Generación<br>${d.generacion_total_MW.toFixed(1)} MW</div>
  `;
}

function renderGeneracion(data){

  const gen=data.kpis_generacion;

  const html=Object.entries(gen).map(([k,v])=>{

    let mw=Number(v.potencia_MW||0);

    let c="ok";
    if(mw===0) c="bad";
    if(mw>50) c="warn";

    return `<div class="k ${c}">${k}<br>${mw.toFixed(1)} MW</div>`;
  }).join("");

  document.getElementById("gen_unidades").innerHTML=html;
}

function renderComparativo(h,a){

  const cont=document.getElementById("comparativo");
  const titulo=document.getElementById("tituloComparativo");

  if(!a){
    cont.innerHTML="<div class='k'>Sin histórico</div>";
    return;
  }

  titulo.innerText=`${h.fecha} vs ${a.fecha}`;

  function box(n,x,y){
    let d=x-y;
    let c=d>0?"ok":d<0?"bad":"";
    return `<div class="k ${c}">${n}<br>${x.toFixed(1)} (${d.toFixed(1)})</div>`;
  }

  cont.innerHTML=`
    ${box("Demanda",h.kpis.demanda_total_MW,a.kpis.demanda_total_MW)}
    ${box("STN",h.kpis.STN,a.kpis.STN)}
    ${box("Gen",h.kpis.generacion_total_MW,a.kpis.generacion_total_MW)}
  `;
}

// ===== GRAFICO =====
function renderGrafico(hist){

  if(hist.length<2) return;

  const c=document.getElementById("grafico");
  const ctx=c.getContext("2d");

  c.width=c.offsetWidth;

  const dem=hist.map(d=>d.kpis.demanda_total_MW);
  const gen=hist.map(d=>d.kpis.generacion_total_MW);

  const max=Math.max(...dem,...gen);
  const min=Math.min(...dem,...gen);
  const r=max-min||1;

  const x=i=>i/(hist.length-1)*c.width;
  const y=v=>300-(v-min)/r*300;

  ctx.clearRect(0,0,c.width,300);

  function draw(arr,color){
    ctx.beginPath(); ctx.strokeStyle=color;
    arr.forEach((v,i)=>{
      let px=x(i),py=y(v);
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    });
    ctx.stroke();
  }

  draw(dem,"#FFD100");
  draw(gen,"#00c853");

  // déficit
  for(let i=0;i<dem.length;i++){
    if(dem[i]>gen[i]){
      ctx.fillStyle="rgba(255,0,0,0.3)";
      ctx.fillRect(x(i)-5,y(dem[i]),10,y(gen[i])-y(dem[i]));
    }
  }
}

// ===== SCADA SIMPLE =====
function renderSCADA(data){

  const c=document.getElementById("scada");
  const ctx=c.getContext("2d");

  c.width=c.offsetWidth;

  ctx.clearRect(0,0,c.width,300);

  ctx.fillStyle="lime";
  ctx.beginPath();
  ctx.arc(c.width/2,150,10,0,6.28);
  ctx.fill();
}

// ===== ALERTAS =====
function renderAlertas(data){

  let k=data.kpis;
  let ul=document.getElementById("alertas");
  ul.innerHTML="";

  if(k.generacion_total_MW < k.demanda_total_MW)
    ul.innerHTML+="<li>🔴 Déficit energético</li>";

  if((k.STN)/(k.demanda_total_MW||1)>0.6)
    ul.innerHTML+="<li>🔴 Alta dependencia STN</li>";

  if(ul.innerHTML==="")
    ul.innerHTML="<li>🟢 Sistema estable</li>";
}

function renderEstado(){
  document.getElementById("estadoSistema").innerText="🟢 OPERACIÓN NORMAL";
}

// ===== MAIN =====
async function cargar(){

  const manifest=await fetch("manifest.json").then(r=>r.json());

  const fechas=manifest.fechas.sort((a,b)=> new Date(a)-new Date(b));

  const input=document.getElementById("inputFecha");

  input.value=fechas.at(-1);

  input.onchange=()=>cargarPorFecha(input.value,fechas);

  cargarPorFecha(fechas.at(-1),fechas);
}

async function cargarPorFecha(fecha,fechas){

  const resp=await fetch("data/"+fecha+".json");
  let data=await resp.json();

  data = adaptarData(data);

  const fechasOrdenadas=[...fechas].sort((a,b)=> new Date(a)-new Date(b));
  const idx=fechasOrdenadas.indexOf(fecha);

  let ant=null;

  if(idx>0){
    ant=await fetch("data/"+fechasOrdenadas[idx-1]+".json").then(r=>r.json());
    ant=adaptarData(ant);
  }

  const hist=await Promise.all(
    fechasOrdenadas.slice(Math.max(0,idx-6),idx+1)
    .map(f=>fetch("data/"+f+".json").then(r=>r.json()).then(adaptarData))
  );

  renderFecha(data);
  renderKpis(data);
  renderGeneracion(data);
  renderComparativo(data,ant);
  renderGrafico(hist);
  renderSCADA(data);
  renderAlertas(data);
  renderEstado();
}

cargar();

</script>

</body>
</html>
