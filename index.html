<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard Eléctrico – GAA/GLH</title>

<style>
body{margin:0;font-family:system-ui;background:#0f1720;color:white}
.card{background:#111e2b;margin:10px;padding:12px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.k{background:#0b141f;padding:10px;border-radius:8px;text-align:center}
.ok{color:#00c853} .warn{color:#ffd600} .bad{color:#ff1744}
canvas{width:100%;height:300px;background:#0a0f1a;border-radius:10px}
h3{margin-top:0}
</style>
</head>

<body>

<h2 style="padding:10px">⚡ Dashboard Eléctrico GAA / GLH</h2>

<div class="card">
<h3>📅 Fecha</h3>
<input type="date" id="inputFecha">
<div id="fechaActual"></div>
</div>

<div class="card">
<h3>📊 KPIs</h3>
<div id="kpis" class="grid"></div>
</div>

<div class="card">
<h3>⚡ Generación</h3>
<div id="gen_unidades" class="grid"></div>
</div>

<div class="card">
<h3 id="tituloComparativo">📊 Comparativo</h3>
<div id="comparativo" class="grid"></div>
</div>

<div class="card">
<h3>📈 Histórico (Demanda vs Generación)</h3>
<canvas id="grafico"></canvas>
</div>

<div class="card">
<h3>🖥️ SCADA</h3>
<canvas id="scada"></canvas>
</div>

<div class="card">
<h3>🚨 Alertas</h3>
<ul id="alertas"></ul>
</div>

<div class="card">
<h3>Estado</h3>
<div id="estadoSistema"></div>
</div>

<script>

// ===== ADAPTADOR JSON =====
function adaptarData(data){

  let totalGen = 0;
  data.kpis_generacion = {};

  if(data.generacion){

    // 🔹 recorrer TODOS los grupos
    Object.entries(data.generacion).forEach(([grupo, fuentes])=>{

      Object.entries(fuentes).forEach(([nombre, valor])=>{

        let mw = Number(valor || 0);

        // ✅ sumar al total
        totalGen += mw;

        // ✅ guardar cada fuente individual
        data.kpis_generacion[nombre] = {
          potencia_MW: mw,
          tipo: grupo
        };

      });
    });
  }

  // ✅ total generación
  data.kpis.generacion_total_MW = totalGen;

  return data;
}

// ===== KPIs =====
function renderKpis(d){
  document.getElementById("kpis").innerHTML=`
    <div class="k">Demanda<br>${d.kpis.demanda_total_MW.toFixed(1)}</div>
    <div class="k">STN<br>${d.kpis.STN.toFixed(1)}</div>
    <div class="k">Generación<br>${d.kpis.generacion_total_MW.toFixed(1)}</div>
  `;
}

// ===== GENERACIÓN =====
function renderGeneracion(data){
  const gen=data.kpis_generacion;
  document.getElementById("gen_unidades").innerHTML =
    Object.entries(gen).map(([k,v])=>{
      let mw=Number(v.potencia_MW||0);
      return `<div class="k">${k}<br>${mw.toFixed(1)} MW</div>`;
    }).join("");
}

// ===== COMPARATIVO =====
function renderComparativo(h,a){

  const cont=document.getElementById("comparativo");

  if(!a){
    cont.innerHTML="<div class='k'>Sin histórico</div>";
    return;
  }

  function box(n,x,y){
    let d=x-y;
    return `<div class="k">${n}<br>${x.toFixed(1)} (${d.toFixed(1)})</div>`;
  }

  cont.innerHTML=`
    ${box("Demanda",h.kpis.demanda_total_MW,a.kpis.demanda_total_MW)}
    ${box("STN",h.kpis.STN,a.kpis.STN)}
    ${box("Gen",h.kpis.generacion_total_MW,a.kpis.generacion_total_MW)}
  `;
}

// ===== GRAFICO CON EJES =====
function renderGrafico(hist){

  if(hist.length<2) return;

  const c=document.getElementById("grafico");
  const ctx=c.getContext("2d");

  c.width=c.offsetWidth;
  c.height=300;

  const dem=hist.map(d=>d.kpis.demanda_total_MW);
  const gen=hist.map(d=>d.kpis.generacion_total_MW);

  const max=Math.max(...dem,...gen);
  const min=Math.min(...dem,...gen);
  const r=max-min||1;

  const m={left:50,bottom:30};

  const x=i=>m.left + i/(hist.length-1)*(c.width-m.left-10);
  const y=v=>c.height-m.bottom - ((v-min)/r)*(c.height-m.bottom-10);

  ctx.clearRect(0,0,c.width,c.height);

  // ===== EJE Y =====
  ctx.strokeStyle="#555";
  ctx.beginPath();
  ctx.moveTo(m.left,0);
  ctx.lineTo(m.left,c.height-m.bottom);
  ctx.stroke();

  ctx.fillStyle="#aaa";
  ctx.font="10px Arial";

  for(let i=0;i<=4;i++){
    let val=min+(r/4)*i;
    let yy=y(val);
    ctx.fillText(val.toFixed(0),5,yy);
    ctx.beginPath();
    ctx.moveTo(m.left-5,yy);
    ctx.lineTo(m.left,yy);
    ctx.stroke();
  }

  // ===== EJE X =====
  ctx.beginPath();
  ctx.moveTo(m.left,c.height-m.bottom);
  ctx.lineTo(c.width,c.height-m.bottom);
  ctx.stroke();

  hist.forEach((d,i)=>{
    let xx=x(i);
    ctx.fillText(d.fecha.slice(5),xx-15,c.height-5);
  });

  // ===== LINEAS =====
  function draw(arr,color){
    ctx.beginPath(); ctx.strokeStyle=color;
    arr.forEach((v,i)=>{
      let px=x(i),py=y(v);
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    });
    ctx.stroke();
  }

  draw(dem,"#FFD100");
  draw(gen,"#00c853");

  // ===== DEFICIT =====
  for(let i=0;i<dem.length;i++){
    if(dem[i]>gen[i]){
      ctx.fillStyle="rgba(255,0,0,0.3)";
      ctx.fillRect(x(i)-5,y(dem[i]),10,y(gen[i])-y(dem[i]));
    }
  }
}

// ===== ALERTAS =====
function renderAlertas(d){
  let ul=document.getElementById("alertas");
  ul.innerHTML="";
  if(d.kpis.generacion_total_MW < d.kpis.demanda_total_MW)
    ul.innerHTML+="<li>🔴 Déficit energético</li>";
}

// ===== MAIN =====
async function cargar(){

  const m=await fetch("manifest.json").then(r=>r.json());
  const fechas=m.fechas.sort((a,b)=> new Date(a)-new Date(b));

  document.getElementById("inputFecha").value=fechas.at(-1);

  cargarPorFecha(fechas.at(-1),fechas);

  document.getElementById("inputFecha").onchange=e=>{
    cargarPorFecha(e.target.value,fechas);
  };
}

async function cargarPorFecha(f,fechas){

  let d=await fetch("data/"+f+".json").then(r=>r.json());
  d=adaptarData(d);

  const orden=[...fechas].sort((a,b)=> new Date(a)-new Date(b));
  const i=orden.indexOf(f);

  let a=null;
  if(i>0){
    a=await fetch("data/"+orden[i-1]+".json").then(r=>r.json());
    a=adaptarData(a);
  }

  let hist=await Promise.all(
    orden.slice(Math.max(0,i-6),i+1).map(x=>
      fetch("data/"+x+".json").then(r=>r.json()).then(adaptarData)
    )
  );

  renderKpis(d);
  renderGeneracion(d);
  renderComparativo(d,a);
  renderGrafico(hist);
  renderAlertas(d);
}

cargar();

</script>

</body>
</html>
