<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard Eléctrico – GAA/GLH</title>

<style>
body{margin:0;font-family:system-ui;background:#0f1720;color:white}
.card{background:#111e2b;margin:10px;padding:12px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.k{background:#0b141f;padding:10px;border-radius:8px;text-align:center}
.ok{color:#00c853}.warn{color:#ffd600}.bad{color:#ff1744}
canvas{width:100%;height:300px;background:#0a0f1a;border-radius:10px}
select,input{background:#0b141f;color:white;padding:6px;border-radius:6px;border:none}
</style>
</head>

<body>

<h2 style="padding:10px">⚡ Dashboard Eléctrico GAA / GLH</h2>

<!-- FECHA -->
<div class="card">
<h3>📅 Fecha</h3>
<input type="date" id="inputFecha">
<div id="fechaActual"></div>
</div>

<!-- KPIs -->
<div class="card">
<h3>📊 KPIs</h3>
<div id="kpis" class="grid"></div>
</div>

<!-- CARGAS -->
<div class="card">
<h3>⚡ Cargas por Gerencia</h3>

<select id="selectGerencia">
<option value="GDT">GDT</option>
<option value="GCH">GCH</option>
<option value="GDA">GDA</option>
<option value="GLC">GLC</option>
</select>

<div id="cargas_detalle" class="grid"></div>
</div>

<!-- GENERACIÓN -->
<div class="card">
<h3>⚡ Generación</h3>
<div id="gen_unidades" class="grid"></div>
</div>

<!-- COMPARATIVO -->
<div class="card">
<h3 id="tituloComparativo">📊 Comparativo</h3>
<div id="comparativo" class="grid"></div>
</div>

<!-- HISTORICO -->
<div class="card">
<h3>📈 Histórico</h3>
<canvas id="grafico"></canvas>
</div>

<!-- SCADA -->
<div class="card">
<h3>🖥️ SCADA</h3>
<canvas id="scada"></canvas>
</div>

<!-- ALERTAS -->
<div class="card">
<h3>🚨 Alertas</h3>
<ul id="alertas"></ul>
</div>

<div class="card">
<h3>Estado Sistema</h3>
<div id="estadoSistema"></div>
</div>

<script>

// ===== FECHA =====
function renderFecha(data){
  document.getElementById("fechaActual").innerText=data.fecha;
}

// ===== KPIs =====
function renderKpis(data){
  const d=data.kpis;
  document.getElementById("kpis").innerHTML=`
    <div class="k">Demanda<br>${d.demanda_total_MW.toFixed(1)}</div>
    <div class="k">STN<br>${d.STN.toFixed(1)}</div>
    <div class="k">Generación<br>${d.generacion_total_MW.toFixed(1)}</div>
  `;
}

// ===== GENERACION =====
function renderGeneracion(data){
  const gen=data.kpis_generacion;
  document.getElementById("gen_unidades").innerHTML=
    Object.entries(gen).map(([k,v])=>{
      let mw=Number(v.potencia_MW||0);
      return `<div class="k">${k}<br>${mw.toFixed(1)}</div>`;
    }).join("");
}

// ===== CARGAS =====
function renderCargas(data,gerencia){
  let d={};
  if(gerencia==="GDT") d=data.cargas.GDT_detalle||{};
  else if(gerencia==="GCH") d=data.cargas.GCH_detalle||{};
  else d=data.cargas.Orinoquia||{};

  let max=Math.max(...Object.values(d).map(v=>v||0));

  document.getElementById("cargas_detalle").innerHTML=
    Object.entries(d).map(([k,v])=>{
      let pct=max?(v/max)*100:0;
      return `<div class="k">${k}<br>${v.toFixed(1)} MW
        <div style="background:#222;height:6px;margin-top:4px">
          <div style="width:${pct}%;height:100%;background:#00c853"></div>
        </div>
      </div>`;
    }).join("");
}

function activarSelectorGerencia(data){
  const s=document.getElementById("selectGerencia");
  s.onchange=()=>renderCargas(data,s.value);
  renderCargas(data,s.value);
}

// ===== COMPARATIVO =====
function renderComparativo(a,b){
  if(!b)return;

  document.getElementById("tituloComparativo").innerText=
    `${a.fecha} vs ${b.fecha}`;

  function box(n,x,y){
    let diff=x-y;
    let c=diff>0?"ok":diff<0?"bad":"";
    return `<div class="k ${c}">${n}<br>${x.toFixed(1)}</div>`;
  }

  document.getElementById("comparativo").innerHTML=`
    ${box("Demanda",a.kpis.demanda_total_MW,b.kpis.demanda_total_MW)}
    ${box("STN",a.kpis.STN,b.kpis.STN)}
    ${box("Gen",a.kpis.generacion_total_MW,b.kpis.generacion_total_MW)}
  `;
}

// ===== HISTÓRICO =====
function renderGrafico(hist){
  let c=document.getElementById("grafico");
  let ctx=c.getContext("2d");
  c.width=c.offsetWidth;

  let d=hist.map(x=>x.kpis.demanda_total_MW);
  let g=hist.map(x=>x.kpis.generacion_total_MW);

  let max=Math.max(...d,...g);
  let min=Math.min(...d,...g);
  let r=max-min||1;

  function draw(arr,color){
    ctx.beginPath();ctx.strokeStyle=color;
    arr.forEach((v,i)=>{
      let x=i/(arr.length-1)*c.width;
      let y=300-((v-min)/r)*300;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    });
    ctx.stroke();
  }

  ctx.clearRect(0,0,c.width,300);
  draw(d,"#FFD100");
  draw(g,"#00c853");
}

// ===== SCADA =====
function renderSCADA(data){
  const c=document.getElementById("scada");
  const ctx=c.getContext("2d");

  c.width=c.offsetWidth;

  ctx.clearRect(0,0,c.width,300);

  let trs=data.sistema_electrico.transformadores.slice(0,6);

  let cx=c.width/2,cy=150;

  ctx.fillStyle="lime";
  ctx.beginPath();ctx.arc(cx,cy,10,0,6.28);ctx.fill();

  trs.forEach((t,i)=>{
    let a=i/trs.length*Math.PI;
    let x=cx+Math.cos(a)*120;
    let y=cy-Math.sin(a)*90;

    ctx.strokeStyle="lime";
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.stroke();
  });
}

// ===== ALERTAS =====
function renderAlertas(data){
  let k=data.kpis,u="";
  if(k.generacion_total_MW<k.demanda_total_MW*0.5)u+="<li>🔴 Baja generación</li>";
  if((k.STN)/(k.demanda_total_MW||1)>0.6)u+="<li>🔴 STN alto</li>";
  if(!u)u="<li>🟢 Estable</li>";
  document.getElementById("alertas").innerHTML=u;
}

function renderEstado(){
  document.getElementById("estadoSistema").innerText="🟢 OK";
}

// ===== CARGA DATA =====
async function cargarPorFecha(f,fechas){

  let data=await fetch("data/"+f+".json").then(r=>r.json());

  let idx=fechas.indexOf(f);
  let ant=null;

  if(idx>0){
    ant=await fetch("data/"+fechas[idx-1]+".json").then(r=>r.json());
  }

  let hist=await Promise.all(
    fechas.slice(Math.max(0,idx-6),idx+1)
    .map(x=>fetch("data/"+x+".json").then(r=>r.json()))
  );

  renderFecha(data);
  renderKpis(data);
  renderGeneracion(data);
  renderComparativo(data,ant);
  renderGrafico(hist);
  renderSCADA(data);
  renderAlertas(data);
  renderEstado();
  activarSelectorGerencia(data);
}

// ===== INIT =====
async function iniciar(){

  let m=await fetch("manifest.json").then(r=>r.json());
  let f=m.fechas.sort();

  let input=document.getElementById("inputFecha");

  input.value=f.at(-1);
  input.onchange=()=>cargarPorFecha(input.value,f);

  cargarPorFecha(f.at(-1),f);
}

iniciar();

</script>

</body>
</html>
