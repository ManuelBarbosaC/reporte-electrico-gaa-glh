<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SCADA Eléctrico – GAA/GLH</title>

<style>
body{margin:0;font-family:system-ui;background:#0f1720;color:white}
.card{background:#111e2b;margin:10px;padding:10px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{background:#0b141f;padding:8px;border-radius:8px}
.ok{color:#00c853}
.warn{color:#ffd600}
.bad{color:#ff1744}
canvas{width:100%;height:400px;background:#0a0f1a;border-radius:10px}
</style>
</head>

<body>

<h2 style="padding:10px">⚡ SCADA Sistema Eléctrico</h2>

<div class="card">
<canvas id="scada"></canvas>
</div>

<div class="card">
<h3>Transformadores</h3>
<div id="transformadores" class="grid"></div>
</div>

<div class="card">
<h3>Líneas</h3>
<div id="lineas" class="grid"></div>
</div>

<div class="card">
<h3>Reactiva</h3>
<div id="reactiva" class="grid"></div>
</div>

<div class="card">
<h3>Alertas</h3>
<ul id="alertas"></ul>
</div>

<div class="card">
<h3>Estado Sistema</h3>
<div id="estadoSistema"></div>
</div>

<script>

// =============================
// SCADA ANIMADO
// =============================
let flowOffset = 0;

function renderSCADA(data){

  const c = document.getElementById("scada");
  const ctx = c.getContext("2d");

  function draw(){

    ctx.clearRect(0,0,c.width,c.height);

    let cx=c.width/2;
    let cy=c.height/2;

    ctx.fillStyle="#00c853";
    ctx.beginPath();
    ctx.arc(cx,cy,20,0,6.28);
    ctx.fill();

    function flow(x1,y1,x2,y2,color){
      for(let i=0;i<12;i++){
        let t=(i+flowOffset)%12/12;
        let x=x1+(x2-x1)*t;
        let y=y1+(y2-y1)*t;
        ctx.fillStyle=color;
        ctx.beginPath();
        ctx.arc(x,y,3,0,6.28);
        ctx.fill();
      }
    }

    let trs=data?.sistema_electrico?.transformadores||[];
    let lns=data?.sistema_electrico?.lineas||[];

    trs.forEach((t,i)=>{
      let angle=i/trs.length*Math.PI;
      let x=cx+Math.cos(angle)*150;
      let y=cy-Math.sin(angle)*120;

      let mw=Number(t.MW);
      let color="lime";
      if(mw>80) color="red";
      else if(mw>60) color="yellow";

      ctx.strokeStyle=color;
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.lineTo(x,y);
      ctx.stroke();

      flow(cx,cy,x,y,color);
    });

    lns.forEach((l,i)=>{
      let angle=i/lns.length*Math.PI+Math.PI;
      let x=cx+Math.cos(angle)*220;
      let y=cy-Math.sin(angle)*140;

      let mw=Number(l.MW);
      let color="#4aa3ff";
      if(mw>110) color="red";
      else if(mw>70) color="yellow";

      ctx.strokeStyle=color;
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.lineTo(x,y);
      ctx.stroke();

      flow(cx,cy,x,y,color);
    });

    flowOffset+=0.2;
    requestAnimationFrame(draw);
  }

  draw();
}

// =============================
// SISTEMA
// =============================
function renderSistema(data){

  let boxTR=document.getElementById("transformadores");
  boxTR.innerHTML="";

  (data.sistema_electrico.transformadores||[]).forEach(t=>{
    let c="ok";
    if(t.MW>80) c="bad";
    else if(t.MW>60) c="warn";

    boxTR.innerHTML+=`<div class="k ${c}">${t.nombre}<br>${t.MW} MW</div>`;
  });

  let boxL=document.getElementById("lineas");
  boxL.innerHTML="";
  (data.sistema_electrico.lineas||[]).forEach(l=>{
    let c="ok";
    if(l.MW>110) c="bad";
    else if(l.MW>70) c="warn";

    boxL.innerHTML+=`<div class="k ${c}">${l.nombre}<br>${l.MW} MW</div>`;
  });

  let boxR=document.getElementById("reactiva");
  boxR.innerHTML="";
  (data.sistema_electrico.reactiva||[]).forEach(r=>{
    boxR.innerHTML+=`<div class="k">${r.nombre}<br>${r.MVAr} MVAr</div>`;
  });
}

// =============================
// ALERTAS
// =============================
function renderAlertas(data){

  let ul=document.getElementById("alertas");
  ul.innerHTML="";

  let alerts=[];

  let dem=data?.kpis?.demanda_promedio_MW||0;
  let stn=data?.kpis?.importacion_GEB_230kV_MW||0;
  let pct=(dem>0)?(stn/dem)*100:0;

  if(pct>70) alerts.push("🔴 Alta dependencia STN");
  else if(pct>50) alerts.push("🟡 Dependencia STN");

  (data?.sistema_electrico?.transformadores||[]).forEach(t=>{
    if(t.MW>85) alerts.push("🔴 TR crítico "+t.nombre);
  });

  if(alerts.length===0) alerts.push("🟢 Sistema normal");

  alerts.forEach(a=>{
    let li=document.createElement("li");
    li.innerText=a;
    ul.appendChild(li);
  });
}

// =============================
// ESTADO
// =============================
function renderEstado(){

  let items=[...document.querySelectorAll("#alertas li")];

  let estado="🟢 NORMAL";

  items.forEach(i=>{
    if(i.innerText.includes("🔴")) estado="🔴 CRÍTICO";
    else if(i.innerText.includes("🟡") && estado!=="🔴 CRÍTICO") estado="🟡 ALERTA";
  });

  document.getElementById("estadoSistema").innerText=estado;
}

// =============================
// CARGA DINÁMICA (CORREGIDO)
// =============================
function cargarDatos(){

  fetch("manifest.json",{cache:"no-store"})
  .then(res=>{
    if(!res.ok) throw new Error("No cargó manifest.json");
    return res.json();
  })
  .then(manifest=>{

    const fechas = (manifest.fechas || []).sort();

    if(fechas.length === 0){
      throw new Error("No hay datos disponibles");
    }

    const ultima = fechas[fechas.length - 1];

    console.log("Cargando:", ultima);

    return fetch("data/" + ultima + ".json",{cache:"no-store"});
  })
  .then(res=>{
    if(!res.ok) throw new Error("No existe JSON");
    return res.json();
  })
  .then(data=>{

    renderSistema(data);
    renderSCADA(data);
    renderAlertas(data);
    renderEstado();

  })
  .catch(err=>{
    console.error(err);
    alert("Error: " + err.message);
  });
}

// ✅ EJECUCIÓN AUTOMÁTICA
cargarDatos();

</script>

</body>
</html>
