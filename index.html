<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard Eléctrico – GAA/GLH</title>

<style>
body{margin:0;font-family:system-ui;background:#0f1720;color:white}
.card{background:#111e2b;margin:10px;padding:12px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.k{background:#0b141f;padding:10px;border-radius:8px;text-align:center}
.ok{color:#00c853} .warn{color:#ffd600} .bad{color:#ff1744}
canvas{width:100%;height:300px;background:#0a0f1a;border-radius:10px}
h3{margin-top:0}
</style>
</head>

<body>

<h2 style="padding:10px">⚡ Dashboard Eléctrico GAA / GLH</h2>

<!-- SELECTOR -->
<div class="card">
<h3>📅 Selección de fecha</h3>

<input type="date" id="inputFecha">
<div id="fechaActual" style="margin-top:8px;"></div>

</div>

<!-- KPIs -->
<div class="card">
<h3>📊 KPIs</h3>
<div id="kpis" class="grid"></div>
</div>

<!-- GENERACIÓN -->
<div class="card">
<h3>⚡ Generación por Unidad</h3>
<div id="gen_unidades" class="grid"></div>
</div>

<!-- COMPARATIVO -->
<div class="card">
<h3 id="tituloComparativo">📊 Comparativo</h3>
<div id="comparativo" class="grid"></div>
</div>

<!-- HISTORICO -->
<div class="card">
<h3>📈 Histórico (Demanda vs Generación)</h3>
<canvas id="grafico"></canvas>
</div>

<!-- SCADA -->
<div class="card">
<h3>🖥️ SCADA</h3>
<canvas id="scada"></canvas>
</div>

<!-- ALERTAS -->
<div class="card">
<h3>🚨 Alertas</h3>
<ul id="alertas"></ul>
</div>

<div class="card">
<h3>Estado Sistema</h3>
<div id="estadoSistema"></div>
</div>

<script>

// ====== UTIL ======
function renderFecha(data){
  document.getElementById("fechaActual").innerText = data.fecha;
}

// ===== KPIs =====
function renderKpis(data){
  const d=data.kpis;
  document.getElementById("kpis").innerHTML=`
    <div class="k">Demanda<br>${d.demanda_total_MW.toFixed(1)} MW</div>
    <div class="k">STN<br>${d.STN.toFixed(1)} MW</div>
    <div class="k">Generación<br>${d.generacion_total_MW.toFixed(1)} MW</div>
  `;
}

// ===== GENERACION =====
function renderGeneracion(data){
  const gen=data.kpis_generacion;
  const html=Object.entries(gen).map(([k,v])=>{
    let mw=Number(v.potencia_MW||0);
    let c="ok";
    if(mw===0) c="bad";
    if(mw>50) c="warn";
    return `
      <div class="k ${c}">
        ${k}<br>${mw.toFixed(1)} MW
      </div>`;
  }).join("");
  document.getElementById("gen_unidades").innerHTML=html;
}

// ===== COMPARATIVO =====
function renderComparativo(actual, anterior){

  const cont = document.getElementById("comparativo");
  const titulo = document.getElementById("tituloComparativo");

  if(!anterior){
    cont.innerHTML = "<div class='k'>Sin histórico</div>";
    titulo.innerText = "Sin comparativo";
    return;
  }

  titulo.innerText = `${actual.fecha} vs ${anterior.fecha}`;

  function fila(n,h,a){
    let diff=h-a;
    let pct=a!==0?(diff/a)*100:0;
    let col=diff>0?"ok":diff<0?"bad":"";
    let icon=diff>0?"▲":diff<0?"▼":"●";
    return `<div class="k ${col}">
      ${n}<br>${h.toFixed(1)}
      <br><small>${icon} ${pct.toFixed(1)}%</small>
    </div>`;
  }

  cont.innerHTML=`
    ${fila("Demanda",actual.kpis.demanda_total_MW,anterior.kpis.demanda_total_MW)}
    ${fila("STN",actual.kpis.STN,anterior.kpis.STN)}
    ${fila("Gen",actual.kpis.generacion_total_MW,anterior.kpis.generacion_total_MW)}
  `;
}

// ===== GRAFICO =====
function renderGrafico(hist){
  if(hist.length<2) return;

  const c=document.getElementById("grafico");
  const ctx=c.getContext("2d");

  c.width=c.offsetWidth;
  c.height=300;

  ctx.clearRect(0,0,c.width,c.height);

  let dem=hist.map(d=>d.kpis.demanda_total_MW);
  let gen=hist.map(d=>d.kpis.generacion_total_MW);

  let max=Math.max(...dem,...gen);
  let min=Math.min(...dem,...gen);
  let rango=max-min||1;

  function draw(data,color){
    ctx.beginPath(); ctx.strokeStyle=color;
    data.forEach((v,i)=>{
      let x=i/(data.length-1)*c.width;
      let y=c.height-((v-min)/rango)*c.height;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.stroke();
  }

  draw(dem,"#FFD100");
  draw(gen,"#00c853");
}

// ===== SCADA =====
function renderSCADA(data){

  const c=document.getElementById("scada");
  const ctx=c.getContext("2d");

  c.width=c.offsetWidth;
  c.height=300;

  const trs=data.sistema_electrico.transformadores.slice(0,6);
  const lns=data.sistema_electrico.lineas.slice(0,6);

  let offset=0;

  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    let cx=c.width/2,cy=c.height/2;

    ctx.fillStyle="#0f0";
    ctx.beginPath(); ctx.arc(cx,cy,10,0,6.28); ctx.fill();

    function flow(x1,y1,x2,y2,color){
      for(let i=0;i<4;i++){
        let t=(i+offset)%4/4;
        ctx.beginPath();
        ctx.fillStyle=color;
        ctx.arc(x1+(x2-x1)*t,y1+(y2-y1)*t,3,0,6.28);
        ctx.fill();
      }
    }

    trs.forEach((t,i)=>{
      let a=i/trs.length*Math.PI;
      let x=cx+Math.cos(a)*120;
      let y=cy-Math.sin(a)*90;
      ctx.strokeStyle="lime";
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y); ctx.stroke();
      flow(cx,cy,x,y,"lime");
    });

    lns.forEach((l,i)=>{
      let a=i/lns.length*Math.PI+Math.PI;
      let x=cx+Math.cos(a)*150;
      let y=cy-Math.sin(a)*110;
      ctx.strokeStyle="#4aa3ff";
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y); ctx.stroke();
      flow(cx,cy,x,y,"#4aa3ff");
    });

    offset+=0.05;
    requestAnimationFrame(draw);
  }

  draw();
}

// ===== ALERTAS =====
function renderAlertas(data){
  let ul=document.getElementById("alertas");
  ul.innerHTML="";
  let k=data.kpis;

  if(k.generacion_total_MW < k.demanda_total_MW*0.5)
    ul.innerHTML+="<li>🔴 Baja generación</li>";

  if((k.STN)/(k.demanda_total_MW||1)>0.6)
    ul.innerHTML+="<li>🔴 Alta dependencia STN</li>";

  if(ul.innerHTML==="")
    ul.innerHTML="<li>🟢 Sistema estable</li>";
}

// ===== ESTADO =====
function renderEstado(){
  document.getElementById("estadoSistema").innerText="🟢 OPERACIÓN NORMAL";
}

// ===== SELECTOR =====

function activarCalendario(fechas){

  const input = document.getElementById("inputFecha");

  // ✅ limitar rango
  input.min = fechas[0];
  input.max = fechas.at(-1);

  // ✅ valor inicial
  input.value = fechas.at(-1);

  input.onchange = () => {
    cargarPorFecha(input.value, fechas);
  };

}


// ===== CARGA POR FECHA =====


async function cargarPorFecha(fecha, fechas){

  if(!fechas.includes(fecha)){
    alert("⚠️ No hay datos para esa fecha");
    return;
  }

  const data = await fetch("data/"+fecha+".json")
    .then(r=>r.json());

  const index = fechas.indexOf(fecha);

  let anterior = null;

  if(index > 0){
    anterior = await fetch("data/"+fechas[index-1]+".json")
      .then(r=>r.json());
  }

  // ✅ histórico real
  const hist_raw = await Promise.all(
    fechas.slice(Math.max(0,index-6),index+1)
      .map(f => fetch("data/"+f+".json")
        .then(r=>r.ok?r.json():null)
      )
  );

  const hist = hist_raw.filter(x=>x);

  renderFecha(data);
  renderKpis(data);
  renderGeneracion(data);
  renderComparativo(data, anterior);
  renderGrafico(hist);
  renderSCADA(data);
  renderAlertas(data);
  renderEstado();
}


// ===== INICIO =====

async function cargarDatos(){

  const manifest = await fetch("manifest.json")
    .then(r=>r.json());

  const fechas = manifest.fechas.sort();

  activarCalendario(fechas);

  await cargarPorFecha(fechas.at(-1), fechas);
}


cargarDatos();

</script>

</body>
</html>
