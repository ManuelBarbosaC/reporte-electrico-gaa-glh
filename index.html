<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard Eléctrico – GAA/GLH</title>

<style>
body{margin:0;font-family:system-ui;background:#0f1720;color:white}
.card{background:#111e2b;margin:10px;padding:10px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{background:#0b141f;padding:8px;border-radius:8px;text-align:center}
.ok{color:#00c853} .warn{color:#ffd600} .bad{color:#ff1744}
canvas{width:100%;height:300px;background:#0a0f1a;border-radius:10px}
</style>
</head>

<body>

<h2 style="padding:10px">⚡ Dashboard Eléctrico GAA / GLH</h2>

<!-- KPIs -->
<div class="card">
<h3>📊 KPIs</h3>
<div id="kpis" class="grid"></div>
</div>

<!-- COMPARATIVO -->
<div class="card">
<h3>📊 HOY vs AYER</h3>
<div id="comparativo" class="grid"></div>
</div>

<!-- GRAFICO -->
<div class="card">
<h3>📈 Historial Demanda</h3>
<canvas id="grafico"></canvas>
</div>

<!-- CONTROL SCADA -->
<div class="card">
<label><input type="checkbox" id="verTR" checked> Transformadores</label>
<label><input type="checkbox" id="verLineas" checked> Líneas</label>
</div>

<!-- SCADA -->
<div class="card">
<canvas id="scada"></canvas>
</div>

<!-- ALERTAS -->
<div class="card">
<h3>🚨 Alertas</h3>
<ul id="alertas"></ul>
</div>

<div class="card">
<h3>Estado Sistema</h3>
<div id="estadoSistema"></div>
</div>

<script>

// KPIs
function renderKpis(data){

  const demanda =
    data.kpis.demanda_promedio_MW ??
    data.kpis.demanda_total_MW ??
    0;

  const STN =
    data.kpis.importacion_GEB_230kV_MW ??
    data.kpis.STN ??
    0;

  const gen =
    data.kpis.generacion_total_MW ??
    data.kpis.Generacion_Total ??
    0;

  document.getElementById("kpis").innerHTML = `
  <div class="k">Demanda<br>${demanda}</div>
  <div class="k">STN<br>${STN}</div>
  <div class="k">Generación<br>${gen}</div>`;
}

// COMPARATIVO
function renderComparativo(hoy,ayer){

  function fila(n,h,a){
    if(!a) return `<div class="k">${n}<br>—</div>`;
    let diff=h-a; let pct=(diff/a)*100;
    let col=diff>0?"ok":"bad";
    let icon=diff>0?"▲":"▼";
    return `<div class="k ${col}">
    ${n}<br>${h}<br><small>${icon} ${pct.toFixed(1)}%</small>
    </div>`;
  }

  document.getElementById("comparativo").innerHTML = `
    ${fila("Demanda",hoy.kpis.demanda_promedio_MW,ayer.kpis.demanda_promedio_MW)}
    ${fila("STN",hoy.kpis.importacion_GEB_230kV_MW,ayer.kpis.importacion_GEB_230kV_MW)}
    ${fila("Gen",hoy.kpis.generacion_total_MW,ayer.kpis.generacion_total_MW)}
  `;
}

// GRAFICO
function renderGrafico(hist){
  const c=document.getElementById("grafico");
  const ctx=c.getContext("2d");

  c.width=c.offsetWidth; c.height=300;

  ctx.clearRect(0,0,c.width,c.height);

  let datos=hist.map(d=>d.kpis.demanda_promedio_MW);

  let max=Math.max(...datos);
  let min=Math.min(...datos);
  let rango=max-min||1;

  ctx.beginPath();
  ctx.strokeStyle="#FFD100";

  datos.forEach((v,i)=>{
    let x=i/(datos.length-1)*c.width;
    let y=c.height-((v-min)/rango)*c.height;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });

  ctx.stroke();
}

// SCADA (SIN PARPADEO)
let iniciado=false;

function renderSCADA(data){

  if(iniciado) return;
  iniciado=true;

  const ctx=document.getElementById("scada").getContext("2d");
  const c=document.getElementById("scada");

  c.width=c.offsetWidth; c.height=300;

  let offset=0;

  function draw(){

    ctx.clearRect(0,0,c.width,c.height);

    let cx=c.width/2; let cy=c.height/2;

    ctx.fillStyle="#00c853";
    ctx.beginPath(); ctx.arc(cx,cy,15,0,6.28); ctx.fill();

    function flujo(x1,y1,x2,y2,color){
      for(let i=0;i<5;i++){
        let t=(i+offset)%5/5;
        ctx.fillStyle=color;
        ctx.beginPath();
        ctx.arc(x1+(x2-x1)*t,y1+(y2-y1)*t,3,0,6.28);
        ctx.fill();
      }
    }

    offset+=0.05;
    requestAnimationFrame(draw);
  }

  draw();
}

// ALERTAS
function renderAlertas(data){
  let ul=document.getElementById("alertas");
  ul.innerHTML="";
  if(data.kpis.importacion_GEB_230kV_MW/data.kpis.demanda_promedio_MW>0.7)
    ul.innerHTML="<li>🔴 Alta dependencia STN</li>";
  else ul.innerHTML="<li>🟢 Sistema estable</li>";
}

// ESTADO
function renderEstado(){
  document.getElementById("estadoSistema").innerText="🟢 NORMAL";
}

// CARGA
function cargarDatos(){

  fetch("manifest.json")
  .then(r=>r.json())
  .then(manifest=>{

    const fechas=manifest.fechas.sort();

    return Promise.all([
      fetch("data/"+fechas.at(-1)+".json").then(r=>r.json()),
      Promise.all(fechas.slice(-7).map(f=>fetch("data/"+f+".json").then(r=>r.json())))
    ]);

  })
  .then(([hoy,hist])=>{

    let ayer=hist.length>1?hist.at(-2):hoy;

    renderKpis(hoy);
    renderComparativo(hoy,ayer);
    renderGrafico(hist);
    renderSCADA(hoy);
    renderAlertas(hoy);
    renderEstado();

  });

}

cargarDatos();

</script>

</body>
</html>
