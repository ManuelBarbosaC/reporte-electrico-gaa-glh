<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard Eléctrico</title>

<style>
body{margin:0;font-family:system-ui;background:#0f1720;color:white}
.card{background:#111e2b;margin:10px;padding:12px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.k{background:#0b141f;padding:10px;border-radius:8px;text-align:center}
canvas{width:100%;height:300px;background:#0a0f1a}
</style>
</head>

<body>

<h2 style="padding:10px">⚡ Dashboard Eléctrico GAA / GLH</h2>

<div class="card">
<input type="date" id="inputFecha">
<div id="fechaActual"></div>
</div>

<div class="card">
<div id="kpis" class="grid"></div>
</div>

<div class="card">
<div id="gen_unidades" class="grid"></div>
</div>

<div class="card">
<div id="comparativo" class="grid"></div>
</div>

<div class="card">
<canvas id="grafico"></canvas>
</div>

<div class="card">
<ul id="alertas"></ul>
</div>

<script>

// ===== ADAPTADOR INTELIGENTE =====
function adaptarData(data){

  if(!data.kpis) data.kpis = {};

  let totalGen = 0;
  data.kpis_generacion = {};

  // ✅ CASO NUEVO: viene generacion estructurada
  if(data.generacion){

    Object.entries(data.generacion).forEach(([grupo, fuentes])=>{
      Object.entries(fuentes || {}).forEach(([nombre, valor])=>{
        let mw = Number(valor || 0);
        totalGen += mw;
        data.kpis_generacion[nombre] = {potencia_MW: mw};
      });
    });
  }

  // ✅ CASO ALTERNATIVO: usar kpis_generacion directamente si existe
  else if(data.kpis_generacion){

    Object.entries(data.kpis_generacion).forEach(([k,v])=>{
      let mw = Number(v.potencia_MW || 0);
      totalGen += mw;
    });
  }

  data.kpis.generacion_total_MW = totalGen;

  data.kpis.demanda_total_MW = Number(data.kpis.demanda_total_MW || 0);
  data.kpis.STN = Number(data.kpis.STN || 0);

  return data;
}

// ===== KPIs =====
function renderKpis(d){
  document.getElementById("kpis").innerHTML=`
    <div class="k">Demanda<br>${d.kpis.demanda_total_MW.toFixed(1)}</div>
    <div class="k">STN<br>${d.kpis.STN.toFixed(1)}</div>
    <div class="k">Generación<br>${d.kpis.generacion_total_MW.toFixed(1)}</div>
  `;
}

// ===== GENERACION =====
function renderGeneracion(d){

  let gen = d.kpis_generacion || {};

  if(Object.keys(gen).length===0){
    document.getElementById("gen_unidades").innerHTML =
      "<div class='k'>⚠ Sin dato de generación</div>";
    return;
  }

  document.getElementById("gen_unidades").innerHTML =
    Object.entries(gen).map(([k,v])=>{
      return `<div class="k">${k}<br>${v.potencia_MW}</div>`;
    }).join("");
}

// ===== COMPARATIVO =====
function renderComparativo(h,a){

  if(!a){
    document.getElementById("comparativo").innerHTML =
      "<div class='k'>Sin histórico</div>";
    return;
  }

  function b(n,x,y){
    let d=x-y;
    return `<div class="k">${n}<br>${x} (${d})</div>`;
  }

  document.getElementById("comparativo").innerHTML = `
    ${b("Dem",h.kpis.demanda_total_MW,a.kpis.demanda_total_MW)}
    ${b("STN",h.kpis.STN,a.kpis.STN)}
    ${b("Gen",h.kpis.generacion_total_MW,a.kpis.generacion_total_MW)}
  `;
}

// ===== GRAFICO =====
function renderGrafico(hist){

  if(hist.length<2) return;

  let c=document.getElementById("grafico");
  let ctx=c.getContext("2d");

  c.width=c.offsetWidth;

  let dem=hist.map(x=>x.kpis.demanda_total_MW);
  let gen=hist.map(x=>x.kpis.generacion_total_MW);

  let max=Math.max(...dem,...gen);
  let min=Math.min(...dem,...gen);
  let r=max-min||1;

  let x=i=>i/(hist.length-1)*c.width;
  let y=v=>300-(v-min)/r*300;

  ctx.clearRect(0,0,c.width,300);

  function draw(arr,color){
    ctx.beginPath(); ctx.strokeStyle=color;
    arr.forEach((v,i)=>{
      let px=x(i),py=y(v);
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    });
    ctx.stroke();
  }

  draw(dem,"#FFD100");
  draw(gen,"#00c853");
}

// ===== ALERTAS =====
function renderAlertas(d){
  let ul=document.getElementById("alertas");
  ul.innerHTML="";
  if(d.kpis.generacion_total_MW < d.kpis.demanda_total_MW)
    ul.innerHTML+="<li>🔴 Déficit</li>";
}

// ===== MAIN =====
async function cargar(){

  const m=await fetch("manifest.json").then(r=>r.json());
  const fechas=m.fechas.sort((a,b)=>new Date(a)-new Date(b));

  document.getElementById("inputFecha").value = fechas.at(-1);

  cargarPorFecha(fechas.at(-1),fechas);

  document.getElementById("inputFecha").onchange=e=>{
    cargarPorFecha(e.target.value,fechas);
  };
}

async function cargarPorFecha(f,fechas){

  let d=adaptarData(await fetch("data/"+f+".json").then(r=>r.json()));

  const orden=[...fechas].sort((a,b)=>new Date(a)-new Date(b));
  const i=orden.indexOf(f);

  let a=null;
  if(i>0){
    a=adaptarData(await fetch("data/"+orden[i-1]+".json").then(r=>r.json()));
  }

  let hist=await Promise.all(
    orden.slice(Math.max(0,i-6),i+1)
    .map(x=>fetch("data/"+x+".json").then(r=>r.json()).then(adaptarData))
  );

  document.getElementById("fechaActual").innerText = f;

  renderKpis(d);
  renderGeneracion(d);
  renderComparativo(d,a);
  renderGrafico(hist);
  renderAlertas(d);
}

cargar();

</script>

</body>
</html>
